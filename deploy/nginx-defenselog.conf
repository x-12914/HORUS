# OPTIONAL — front Defense-LOG with your existing Nginx instead of exposing
# the raw port. Use this once you want a clean URL / TLS.
#
# 1. Change the systemd ExecStart bind from 0.0.0.0:8050 to 127.0.0.1:8050
#    so the app is only reachable through Nginx.
# 2. Drop this file in /etc/nginx/sites-available/ and symlink into
#    sites-enabled/, OR paste the server block into your existing config.
# 3. sudo nginx -t && sudo systemctl reload nginx
#
# --- Subdomain style (recommended): defenselog.example.com ---
server {
    listen 80;
    server_name defenselog.example.com;   # <-- your subdomain + DNS A record

    # For HTTPS, run certbot afterwards:  sudo certbot --nginx -d defenselog.example.com
    location / {
        proxy_pass         http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# --- Subpath style alternative: example.com/defenselog/ ---
# Add this location to an EXISTING server { } block instead of the above.
# Note: serving under a subpath also needs the app told its prefix — set
# Environment in systemd:  SCRIPT_NAME=/defenselog  (Gunicorn forwards it).
#
